name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run offline regression tests
        shell: powershell
        run: ./test.ps1
      - name: Build Windows x64 release
        shell: powershell
        run: ./scripts/package-release.ps1 -Architecture x64
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: GGS-WiFi-windows-x64
          path: |
            outputs/GGS-WiFi-v*-windows-x64.exe
            outputs/GGS-WiFi-v*-windows-x64.zip
            outputs/SHA256SUMS.txt
          if-no-files-found: error
